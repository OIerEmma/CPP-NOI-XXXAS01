<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ 智能爱心义卖系统 · 优惠券购物车</title>
    <style>
        :root {
            --primary: #e8574f;
            --primary-dark: #c0392b;
            --gold: #f0a500;
            --bg: #fef9f5;
            --card-bg: #ffffff;
            --text: #3d2c2c;
            --text-light: #6b5555;
            --border: #f0e0d6;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --radius: 16px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #fef5f0 0%, #fff0eb 25%, #fef9f5 50%, #fff5f0 75%, #fef8f4 100%);
            min-height: 100vh;
            color: var(--text);
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 24px;
        }
        .header {
            text-align: center;
            padding: 28px 20px 20px;
        }
        .header .logo-icon {
            font-size: 3.2rem;
            display: inline-block;
            animation: heartbeat 1.2s infinite;
        }
        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1)
            }
            14% {
                transform: scale(1.25)
            }
            28% {
                transform: scale(1)
            }
            42% {
                transform: scale(1.2)
            }
            56% {
                transform: scale(1)
            }
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #e8574f, #c0392b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stats-row {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 24px;
        }
        .stat-card {
            flex: 1 1 200px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid var(--border);
        }
        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr
            }
        }
        .panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            background: #fefbf9;
        }
        .panel-body {
            padding: 18px 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 500px;
        }
        thead th {
            background: #fef5f0;
            padding: 12px 14px;
            text-align: left;
        }
        tbody td {
            padding: 11px 14px;
            border-bottom: 1px solid #fdf0e8;
        }
        .stock-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.82rem;
        }
        .stock-badge.in-stock {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .stock-badge.low {
            background: #fff8e1;
            color: #e65100;
        }
        .stock-badge.sold-out {
            background: #ffebee;
            color: #c62828;
        }
        .price-tag {
            font-weight: 700;
            color: #e8574f;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.15s, opacity 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-gold {
            background: linear-gradient(135deg, #f0a500, #e8960a);
            color: #fff;
        }
        .btn-danger-sm {
            background: #fff;
            color: #c0392b;
            border: 1px solid #f5c6cb;
            font-size: 0.72rem;
            padding: 4px 10px;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-danger-sm:hover {
            background: #fde8e8;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #444;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-row {
            display: flex;
            gap: 12px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
            color: #fff;
            animation: toastIn 0.35s, toastOut 0.35s 2.2s forwards;
            pointer-events: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }
        .toast.success {
            background: #27ae60;
        }
        .toast.error {
            background: #e74c3c;
        }
        .toast.warning {
            background: #f39c12;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-40px)
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0)
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(-50%) translateY(0)
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px)
            }
        }
        .confetti-particle {
            position: fixed;
            pointer-events: none;
            z-index: 3000;
            font-size: 1.5rem;
            animation: confettiFall 1.5s ease-out forwards;
        }
        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg)
            }
            100% {
                opacity: 0;
                transform: translateY(300px) rotate(720deg)
            }
        }
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #c0b0a5;
            font-size: 1.1rem;
        }
        .empty-state p {
            margin-top: 6px;
        }
        .cart-search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .cart-search-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 25px;
            font-size: 0.95rem;
        }
        .cart-search-row input:focus {
            outline: none;
            border-color: var(--gold);
        }
        .cart-summary {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .cart-total {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }
        .coupon-area {
            margin: 16px 0;
            padding: 12px 16px;
            background: #fefbf8;
            border-radius: 10px;
            border: 1px dashed #f0c4b0;
        }
        .coupon-area h4 {
            font-size: 0.95rem;
            margin-bottom: 8px;
        }
        .coupon-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .coupon-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            padding: 5px 12px 5px 14px;
            border-radius: 20px;
            border: 1px solid #eee;
            font-size: 0.85rem;
        }
        .coupon-btn {
            background: #f0f0f0;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.15s;
        }
        .coupon-btn:hover {
            background: #ddd;
        }
        .discount-display {
            margin-top: 8px;
            color: #888;
            font-size: 0.9rem;
        }
        .discount-display strong {
            color: var(--primary);
        }
        .table-wrap {
            overflow-x: auto;
        }
        .footer-note {
            text-align: center;
            color: #bbb;
            font-size: 0.8rem;
            padding: 12px 0 4px;
            border-top: 1px solid var(--border);
            margin-top: 16px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .stats-row .stat-card {
                flex: 1 1 100%;
            }
            .panel-body {
                padding: 12px;
            }
            table {
                font-size: 0.78rem;
                min-width: 400px;
            }
            .form-row {
                flex-direction: column;
                gap: 6px;
            }
            .cart-summary {
                flex-direction: column;
                align-items: stretch;
            }
            .coupon-row {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <span class="logo-icon">❤️</span>
        <h1>智能爱心义卖系统</h1>
        <p style="color:var(--text-light)">每一份爱心，都值得被铭记</p>
    </div>

    <div class="stats-row">
        <div class="stat-card"><div class="stat-icon" style="background:#fff3e0;color:#f0a500;">💰</div><div><div class="stat-value" id="totalRevenue">¥0.00</div><div>爱心营业额</div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#fce4ec;color:#e8574f;">📦</div><div><div class="stat-value" id="totalSoldCount">0</div><div>已售商品总数</div></div></div>
        <div class="stat-card"><div class="stat-icon" style="background:#e8f5e9;color:#27ae60;">🏷️</div><div><div class="stat-value" id="totalProducts">0</div><div>在售商品种类</div></div></div>
    </div>

    <div class="main-grid">
        <div class="panel">
            <div class="panel-header">📋 商品列表</div>
            <div class="panel-body">
                <div class="table-wrap">
                    <table><thead><tr><th>编号</th><th>名称</th><th>库存</th><th>单价</th><th>操作</th></tr></thead><tbody id="productTableBody"></tbody></table>
                </div>
                <div class="empty-state" id="productEmpty" style="display:none;">📭<p>暂无商品，请添加</p></div>
            </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:20px;">
            <div class="panel">
                <div class="panel-header">➕ 添加商品</div>
                <div class="panel-body">
                    <form id="addProductForm" autocomplete="off">
                        <div class="form-row">
                            <div class="form-group"><label>商品编号 *</label><input type="text" id="inputProductId" placeholder="A001" required></div>
                            <div class="form-group"><label>商品名称 *</label><input type="text" id="inputProductName" placeholder="爱心手工皂" required></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>库存数量 *</label><input type="number" id="inputStock" value="1" min="0" required></div>
                            <div class="form-group"><label>单价 (元) *</label><input type="number" id="inputPrice" value="10.00" step="0.01" min="0.01" required></div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%">✅ 添加商品</button>
                    </form>
                </div>
            </div>

            <div class="panel" style="border:2px dashed #f0c4b0;background:#fffbf8;">
                <div class="panel-header" style="background:#fff9f5;">🛒 购物车</div>
                <div class="panel-body">
                    <div class="cart-search-row">
                        <input type="text" id="cartProductIdInput" placeholder="输入商品编号，如 A001">
                        <button class="btn btn-gold" id="addToCartBtn">➕ 加入</button>
                    </div>
                    <div style="max-height:220px; overflow-y:auto;">
                        <div class="table-wrap">
                            <table><thead><tr><th>编号</th><th>名称</th><th>单价</th><th>数量</th><th>小计</th><th>操作</th></tr></thead><tbody id="cartTableBody"></tbody></table>
                        </div>
                    </div>
                    <div class="empty-state" id="cartEmpty">🛒<p>购物车是空的</p></div>

                    <div class="coupon-area">
                        <h4>🎫 优惠券（可叠加，折扣相乘）</h4>
                        <div class="coupon-row" id="couponContainer"></div>
                        <div class="discount-display">当前折扣：<strong id="discountDisplay">无折扣</strong></div>
                    </div>

                    <div class="cart-summary">
                        <span class="cart-total" id="cartTotal">合计：¥0.00</span>
                        <button class="btn btn-primary" id="checkoutBtn">💳 结算付款</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">📜 销售记录 <span style="font-weight:400;font-size:0.78rem;color:var(--text-light);">（退款将恢复库存）</span></div>
        <div class="panel-body">
            <div class="table-wrap">
                <table><thead><tr><th>记录ID</th><th>商品编号</th><th>商品名称</th><th>实收金额</th><th>优惠券</th><th>购买时间</th><th>操作</th></tr></thead><tbody id="salesTableBody"></tbody></table>
            </div>
            <div class="empty-state" id="salesEmpty">📭<p>暂无销售记录</p></div>
        </div>
    </div>

    <div class="footer-note">💡 数据自动保存在浏览器中，刷新页面不会丢失</div>
</div>
<div id="toastContainer"></div>

<script>
    (function() {
        const $ = id => document.getElementById(id);
        let products = [],
            sales = [],
            cart = [];
        let saleIdCounter = 0;
        let couponQuantities = { '五折': 0, '六折': 0, '七折': 0, '八折': 0, '九折': 0 };
        const couponRates = { '五折': 0.5, '六折': 0.6, '七折': 0.7, '八折': 0.8, '九折': 0.9 };

        const escapeHtml = str => { const d = document.createElement('div');
            d.textContent = str; return d.innerHTML; };
        const formatPrice = p => '¥' + Number(p).toFixed(2);
        const formatTime = iso => {
            const d = new Date(iso);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
        };
        const findProduct = id => products.find(p => p.productId.trim() === id.trim());

        function showToast(msg, type = 'success') {
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            $('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 2600);
        }

        function confetti() {
            const emojis = ['🎉', '💖', '✨', '💝', '🌟', '❤️'];
            for (let i = 0; i < 20; i++) setTimeout(() => {
                const e = document.createElement('span');
                e.className = 'confetti-particle';
                e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                e.style.left = Math.random() * 80 + 10 + '%';
                e.style.top = Math.random() * 20 + 5 + '%';
                e.style.fontSize = (1.2 + Math.random() * 1.2) + 'rem';
                document.body.appendChild(e);
                setTimeout(() => e.remove(), 1600);
            }, i * 45);
        }

        function load() {
            try {
                const p = localStorage.getItem('charity_products_v8');
                const s = localStorage.getItem('charity_sales_v8');
                products = p ? JSON.parse(p) : [
                    { productId: 'A001', productName: '爱心手工皂', stock: 20, price: 15 },
                    { productId: 'A002', productName: '手绘明信片', stock: 50, price: 5 },
                    { productId: 'A003', productName: '编织手链', stock: 30, price: 10 },
                    { productId: 'B001', productName: '手工曲奇饼干', stock: 15, price: 25 },
                    { productId: 'B002', productName: '多肉小盆栽', stock: 25, price: 12 }
                ];
                sales = s ? JSON.parse(s) : [];
                saleIdCounter = sales.length ? Math.max(...sales.map(s => s.saleId)) + 1 : 0;
            } catch (e) { products = [];
                sales = []; }
        }

        function save() {
            localStorage.setItem('charity_products_v8', JSON.stringify(products));
            localStorage.setItem('charity_sales_v8', JSON.stringify(sales));
        }

        function discountFactor() {
            let f = 1;
            for (let n in couponQuantities) f *= Math.pow(couponRates[n], couponQuantities[n]);
            return f;
        }

        function finalTotal() {
            let sum = 0;
            cart.forEach(i => sum += i.price * i.quantity);
            return sum * discountFactor();
        }

        function renderCoupons() {
            $('couponContainer').innerHTML = Object.keys(couponRates).map(name => `
                    <div class="coupon-item">
                        <span>${name}</span><span style="color:#888;font-size:0.75rem;">(${couponRates[name]*100}%)</span>
                        <button class="coupon-btn" data-coupon="${name}" data-act="minus">−</button>
                        <span style="min-width:20px;text-align:center;">${couponQuantities[name]}</span>
                        <button class="coupon-btn" data-coupon="${name}" data-act="plus">+</button>
                    </div>`).join('');
            const f = discountFactor();
            $('discountDisplay').textContent = f === 1 ? '无折扣' : (f * 100).toFixed(1) + '%';
        }

        function renderCart() {
            if (!cart.length) {
                $('cartTableBody').innerHTML = '';
                $('cartEmpty').style.display = 'block';
            } else {
                $('cartEmpty').style.display = 'none';
                $('cartTableBody').innerHTML = cart.map((item, i) => `
                        <tr><td>${escapeHtml(item.productId)}</td><td>${escapeHtml(item.productName)}</td>
                        <td class="price-tag">${formatPrice(item.price)}</td><td>${item.quantity}</td>
                        <td class="price-tag">${formatPrice(item.price*item.quantity)}</td>
                        <td><button class="btn-danger-sm" data-cart-remove="${i}">🗑 删除</button></td></tr>`).join('');
            }
            $('cartTotal').textContent = `合计：${formatPrice(finalTotal())}`;
        }

        function renderProducts() {
            if (!products.length) {
                $('productTableBody').innerHTML = '';
                $('productEmpty').style.display = 'block';
            } else {
                $('productEmpty').style.display = 'none';
                $('productTableBody').innerHTML = products.map(p => {
                    let badge = '';
                    if (p.stock <= 0) badge = `<span class="stock-badge sold-out">售罄</span>`;
                    else if (p.stock <= 5) badge = `<span class="stock-badge low">仅剩${p.stock}</span>`;
                    else badge = `<span class="stock-badge in-stock">有货(${p.stock})</span>`;
                    return `<tr><td>${escapeHtml(p.productId)}</td><td>${escapeHtml(p.productName)}</td>
                        <td>${badge}</td>
                        <td class="price-tag">${formatPrice(p.price)}</td>
                        <td><button class="btn-danger-sm" data-delete="${escapeHtml(p.productId)}">🗑 删除</button></td></tr>`;
                }).join('');
            }
        }

        function renderSales() {
            if (!sales.length) {
                $('salesTableBody').innerHTML = '';
                $('salesEmpty').style.display = 'block';
            } else {
                $('salesEmpty').style.display = 'none';
                $('salesTableBody').innerHTML = [...sales].reverse().map(s => {
                    let coup = '无';
                    if (s.coupons?.length) coup = s.coupons.map(c => `${c.name}×${c.quantity}`).join(', ');
                    return `<tr><td>#${s.saleId}</td><td>${escapeHtml(s.productId)}</td><td>${escapeHtml(s.productName)}</td>
                        <td class="price-tag">${formatPrice(s.price)}</td><td>${coup}</td><td>${formatTime(s.saleTime)}</td>
                        <td><button class="btn-danger-sm" data-refund="${s.saleId}">↩ 退款</button></td></tr>`;
                }).join('');
            }
        }

        function renderStats() {
            const totalRevenue = sales.reduce((sum, s) => sum + Number(s.price), 0);
            $('totalRevenue').textContent = formatPrice(totalRevenue);
            $('totalSoldCount').textContent = sales.length;
            $('totalProducts').textContent = products.length;
        }

        function refresh() { renderProducts();
            renderSales();
            renderCoupons();
            renderCart();
            renderStats(); }

        // ----- 业务逻辑 -----
        function addProduct(id, name, stock, price) {
            if (findProduct(id)) { showToast('编号已存在，请换一个', 'warning'); return; }
            products.push({ productId: id.trim(), productName: name.trim(), stock: Math.max(0, parseInt(stock)),
                price: Math.max(0.01, parseFloat(price)) });
            save();
            refresh();
            showToast(`✅ 商品“${name}”已添加`);
        }

        function deleteProduct(id) {
            const idx = products.findIndex(p => p.productId === id);
            if (idx === -1) return;
            if (!confirm(`确定删除商品“${products[idx].productName}”吗？`)) return;
            cart = cart.filter(i => i.productId !== id);
            products.splice(idx, 1);
            save();
            refresh();
            showToast('已删除商品', 'warning');
        }

        function addToCart(id) {
            const p = findProduct(id);
            if (!p) { showToast('❌ 商品不存在', 'error'); return; }
            if (p.stock <= 0) { showToast('已售罄', 'error'); return; }
            const exist = cart.find(i => i.productId === id);
            if (exist && exist.quantity + 1 > p.stock) { showToast('库存不足', 'warning'); return; }
            if (exist) exist.quantity++;
            else cart.push({ productId: p.productId, productName: p.productName, price: p.price, quantity: 1 });
            renderCart();
            showToast(`➕ 已加入：${p.productName}`);
        }

        function removeCartItem(idx) {
            if (idx >= 0 && idx < cart.length) {
                const name = cart[idx].productName;
                cart.splice(idx, 1);
                renderCart();
                showToast(`已移除“${name}”`, 'warning');
            }
        }

        function checkout() {
            if (!cart.length) { showToast('购物车为空', 'warning'); return; }
            for (let i of cart) {
                const p = findProduct(i.productId);
                if (!p) { showToast(`商品“${i.productName}”已被删除，请移除`, 'error'); return; }
                if (p.stock < i.quantity) { showToast(`“${p.productName}”库存不足`, 'error'); return; }
            }
            const factor = discountFactor();
            const totalPay = finalTotal();
            if (totalPay <= 0) { showToast('金额为0，无法结算', 'warning'); return; }
            if (!confirm(`确认支付 ${formatPrice(totalPay)} 吗？`)) return;

            const used = [];
            for (let n in couponQuantities)
                if (couponQuantities[n] > 0) used.push({ name: n, rate: couponRates[n], quantity: couponQuantities[
                        n] });

            cart.forEach(i => {
                const p = findProduct(i.productId);
                const discountedPrice = Math.round((p.price * factor) * 100) / 100;
                p.stock -= i.quantity;
                for (let j = 0; j < i.quantity; j++) {
                    sales.push({
                        saleId: saleIdCounter++,
                        productId: p.productId,
                        productName: p.productName,
                        price: discountedPrice,
                        coupons: used.length ? JSON.parse(JSON.stringify(used)) : [],
                        saleTime: new Date().toISOString()
                    });
                }
            });

            cart = [];
            for (let n in couponQuantities) couponQuantities[n] = 0;
            save();
            refresh();
            confetti();
            showToast('🎉 支付成功！感谢您的爱心 ❤️');
        }

        function refund(saleId) {
            const idx = sales.findIndex(s => s.saleId === saleId);
            if (idx === -1) return;
            const sale = sales[idx];
            if (!confirm(`确定退款“${sale.productName}” (${formatPrice(sale.price)}) 吗？`)) return;
            const p = findProduct(sale.productId);
            if (p) p.stock++;
            sales.splice(idx, 1);
            save();
            refresh();
            showToast('↩ 已退款，库存已恢复', 'warning');
        }

        // ----- 事件绑定 -----
        $('productTableBody').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            if (btn.dataset.delete) deleteProduct(btn.dataset.delete);
        });

        $('salesTableBody').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            if (btn.dataset.refund) refund(parseInt(btn.dataset.refund));
        });

        $('cartTableBody').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            if (btn.dataset.cartRemove !== undefined) removeCartItem(parseInt(btn.dataset.cartRemove));
        });

        $('addProductForm').addEventListener('submit', e => {
            e.preventDefault();
            const id = $('inputProductId').value.trim();
            const name = $('inputProductName').value.trim();
            const stock = parseInt($('inputStock').value);
            const price = parseFloat($('inputPrice').value);
            if (!id || !name || isNaN(stock) || stock < 0 || isNaN(price) || price <= 0) {
                showToast('请检查输入', 'warning');
                return;
            }
            addProduct(id, name, stock, price);
            $('inputProductId').value = '';
            $('inputProductName').value = '';
            $('inputStock').value = '1';
            $('inputPrice').value = '10.00';
            $('inputProductId').focus();
        });

        $('addToCartBtn').addEventListener('click', () => {
            const id = $('cartProductIdInput').value.trim();
            if (!id) { showToast('请输入商品编号', 'warning'); return; }
            addToCart(id);
            $('cartProductIdInput').value = '';
            $('cartProductIdInput').focus();
        });

        $('cartProductIdInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') { $('addToCartBtn').click(); }
        });

        $('checkoutBtn').addEventListener('click', checkout);

        $('couponContainer').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            const name = btn.dataset.coupon;
            if (btn.dataset.act === 'minus' && couponQuantities[name] > 0) couponQuantities[name]--;
            else if (btn.dataset.act === 'plus') couponQuantities[name]++;
            renderCoupons();
            renderCart();
        });

        // 键盘快捷键：回车快速加入购物车（在输入框内）
        $('cartProductIdInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                $('addToCartBtn').click();
            }
        });

        // 初始化
        load();
        refresh();

        // 页面加载后聚焦到购物车输入框
        setTimeout(() => $('cartProductIdInput').focus(), 300);
    })();
</script>
</body>
</html>
